<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengelola Kontak Client</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>📇 PENGELOLA KONTAK CLIENT</h2>

  <form id="contactForm">
    <input type="hidden" id="contactId">
    <input type="text" id="nama" placeholder="Nama" required maxlength="20">
    <input type="text" id="telepon" placeholder="Telepon" required>
    <input type="email" id="email" placeholder="Email" required maxlength="20">
    <input type="text" id="perusahaan" placeholder="Perusahaan" maxlength="20">
    <input type="text" id="catatan" placeholder="Catatan" maxlength="20">
    <button type="submit" class="btn-save">💾 Simpan</button>
    <button type="button" class="btn-cancel" onclick="clearForm()">❌ Batal</button>
  </form>

  <input type="text" id="searchInput" placeholder="🔍 Cari kontak..." onkeyup="filterContacts()">

  <div class="top-buttons">
    <button id="deleteSelectedBtn" onclick="deleteSelected()" style="display:none;">🗑️ Hapus yang Dipilih</button>
    <button onclick="copyTable()">📋 Salin Semua</button>
    <button onclick="exportCSV()">📤 Ekspor CSV</button>
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
        <th>No</th>
        <th>Nama</th>
        <th>Telepon</th>
        <th>Email</th>
        <th>Perusahaan</th>
        <th>Catatan</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="contactsTable"></tbody>
  </table>
</div>

<!-- Modal Detail -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3>Detail Kontak</h3>
    <div id="modalBody"></div>
    <button class="close-btn" onclick="closeModal()">Tutup</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
