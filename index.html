<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengelola Kontak Client</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container fade-in">
  <h2>📇 PENGELOLA KONTAK CLIENT</h2>

  <!-- FORM CREATE -->
  <form id="contactForm">
    <input type="text" id="nama" placeholder="Nama" required maxlength="20">
    <input type="text" id="telepon" placeholder="Telepon" required>
    <input type="email" id="email" placeholder="Email" required maxlength="30">
    <input type="text" id="perusahaan" placeholder="Perusahaan" maxlength="20">
    <input type="text" id="catatan" placeholder="Catatan" maxlength="20">
    <button type="submit" class="btn-save">💾 Tambah Kontak</button>
  </form>

  <input type="text" id="searchInput" placeholder="🔍 Cari kontak...">

  <div class="actions">
    <button id="deleteSelectedBtn" style="display:none;">🗑️ Hapus yang Dipilih</button>
    <button id="exportCSVBtn">⬇️ Ekspor CSV</button>
    <button id="copyAllBtn">📋 Salin Semua</button>
  </div>

  <table>
    <thead>
      <tr>
        <th><input type="checkbox" id="selectAll"></th>
        <th>No</th>
        <th>Nama</th>
        <th>Telepon</th>
        <th>Email</th>
        <th>Perusahaan</th>
        <th>Catatan</th>
        <th>Aksi</th>
      </tr>
    </thead>
    <tbody id="contactsTable"></tbody>
  </table>
</div>

<!-- MODAL DETAIL -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>Detail Kontak</h3>
    <p id="detailText"></p>
  </div>
</div>

<!-- MODAL EDIT -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Kontak</h3>
    <form id="editForm">
      <input type="hidden" name="editId">
      <input type="text" name="editNama" placeholder="Nama" required maxlength="20">
      <input type="text" name="editTelepon" placeholder="Telepon" required>
      <input type="email" name="editEmail" placeholder="Email" required maxlength="30">
      <input type="text" name="editPerusahaan" placeholder="Perusahaan" maxlength="20">
      <input type="text" name="editCatatan" placeholder="Catatan" maxlength="20">
      <button type="submit" class="btn-save">💾 Simpan</button>
      <button type="button" id="editCancelBtn" class="btn-cancel" style="display:none;">❌ Batal</button>
    </form>
  </div>
</div>

<!-- MODAL CONFIRM -->
<div id="confirmModal" class="modal">
  <div class="modal-content">
    <p id="confirmText"></p>
    <button id="confirmYes" class="btn-save">Ya</button>
    <button id="confirmNo" class="btn-cancel">Tidak</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="script.js"></script>
</body>
</html>
