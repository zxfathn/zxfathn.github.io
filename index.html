<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengelola Kontak Client</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h2>📇 Pengelola Kontak Client</h2>

<form id="contactForm">
  <input type="hidden" id="contactId">
  <input type="text" id="nama" placeholder="Nama" required>
  <input type="text" id="telepon" placeholder="Telepon" required>
  <input type="email" id="email" placeholder="Email" required>
  <input type="text" id="perusahaan" placeholder="Perusahaan">
  <input type="text" id="catatan" placeholder="Catatan">
  <button type="submit">💾 Simpan</button>
  <button type="button" onclick="clearForm()">❌ Batal</button>
</form>

<input type="text" id="searchInput" placeholder="🔍 Cari kontak..." onkeyup="filterContacts()">

<button id="deleteSelectedBtn" onclick="deleteSelected()" style="display:none;">🗑️ Hapus yang dipilih</button>

<table>
  <thead>
    <tr>
      <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
      <th>No</th><th>Nama</th><th>Telepon</th><th>Email</th><th>Perusahaan</th><th>Catatan</th><th>Aksi</th>
    </tr>
  </thead>
  <tbody id="contactsTable"></tbody>
</table>
</div>

<script src="script.js"></script>
</body>
</html>
