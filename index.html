<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengelola Kontak Client</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container fade-in">
  <h2>📇 PENGELOLA KONTAK CLIENT</h2>

  <input type="text" id="searchInput" placeholder="🔍 Cari kontak...">

  <div class="actions">
    <button id="deleteSelectedBtn" style="display:none;">🗑️ Hapus yang Dipilih</button>
    <button id="exportCSVBtn">⬇️ Ekspor CSV</button>
    <button id="copyAllBtn">📋 Salin Semua</button>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll"></th>
          <th>No</th>
          <th>Nama</th>
          <th>Telepon</th>
          <th>Email</th>
          <th>Perusahaan</th>
          <th>Catatan</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="contactsTable"></tbody>
    </table>
  </div>
</div>

<!-- Detail Modal -->
<div id="detailModal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <h3>Detail Kontak</h3>
    <p id="detailText"></p>
  </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3>Edit Kontak</h3>
    <form id="editForm">
      <input type="hidden" id="editId">
      <input type="text" id="editNama" placeholder="Nama" required maxlength="20">
      <input type="text" id="editTelepon" placeholder="Telepon" required>
      <input type="email" id="editEmail" placeholder="Email" required maxlength="30">
      <input type="text" id="editPerusahaan" placeholder="Perusahaan" maxlength="20">
      <input type="text" id="editCatatan" placeholder="Catatan" maxlength="20">
      <div class="modal-buttons">
        <button type="submit" class="btn-save">💾 Simpan</button>
        <button type="button" class="btn-cancel" id="editCancelBtn">❌ Batal</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- Confirm Modal -->
<div id="confirmModal" class="modal">
  <div class="modal-content confirm">
    <p id="confirmText">Apakah Anda yakin?</p>
    <div class="confirm-buttons">
      <button id="confirmYes" class="btn-save">Ya</button>
      <button id="confirmNo" class="btn-cancel">Batal</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
